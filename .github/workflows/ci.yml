name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.5

jobs:
  analyze-and-test:
    name: analyze-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Fetch source
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git fetch --depth=1 origin "refs/pull/${PR_NUMBER}/merge"
          else
            git fetch --depth=1 origin "$GITHUB_SHA"
          fi
          git checkout --detach FETCH_HEAD

      - name: Install Flutter
        run: |
          archive="$RUNNER_TEMP/flutter_linux.tar.xz"
          curl --fail --location \
            "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz" \
            --output "$archive"
          printf '%s  %s\n' \
            '2132e990f236f8d22e7c6314b29a191a95b10d7cbcfec9b4e2e303d996652cbb' \
            "$archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/flutter-sdk"
          tar -xJf "$archive" -C "$RUNNER_TEMP/flutter-sdk"
          echo "$RUNNER_TEMP/flutter-sdk/flutter/bin" >> "$GITHUB_PATH"

      - name: Analyze and test
        run: |
          flutter pub get
          flutter analyze
          flutter test
