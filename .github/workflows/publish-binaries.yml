name: Publish preview binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish
        required: true
        type: string

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.47.5

jobs:
  build-linux-android:
    name: Build Linux and Android
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Fetch tagged source
        run: |
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "refs/tags/${RELEASE_TAG}"
          git checkout --detach FETCH_HEAD

      - name: Install Flutter
        run: |
          archive="$RUNNER_TEMP/flutter_linux.tar.xz"
          curl --fail --location \
            "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz" \
            --output "$archive"
          printf '%s  %s\n' \
            '2132e990f236f8d22e7c6314b29a191a95b10d7cbcfec9b4e2e303d996652cbb' \
            "$archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/flutter-sdk"
          tar -xJf "$archive" -C "$RUNNER_TEMP/flutter-sdk"
          echo "$RUNNER_TEMP/flutter-sdk/flutter/bin" >> "$GITHUB_PATH"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev

      - name: Build Linux and Android artifacts
        run: |
          version="${RELEASE_TAG#v}"
          flutter pub get
          flutter build linux --release --build-name "$version" --build-number "$GITHUB_RUN_NUMBER"
          flutter build apk --release --build-name "$version" --build-number "$GITHUB_RUN_NUMBER"
          tar -czf Dayforge-linux-x64.tar.gz -C build/linux/x64/release/bundle .
          cp build/app/outputs/flutter-apk/app-release.apk Dayforge-android-preview.apk

      - name: Publish Linux and Android assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              Dayforge-linux-x64.tar.gz Dayforge-android-preview.apk --clobber
          else
            gh release create "$RELEASE_TAG" \
              Dayforge-linux-x64.tar.gz Dayforge-android-preview.apk \
              --title "Dayforge $RELEASE_TAG" \
              --generate-notes \
              --prerelease
          fi

  build-windows:
    name: Build Windows
    needs: build-linux-android
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Fetch tagged source
        shell: pwsh
        run: |
          git init
          git remote add origin "https://github.com/$env:GITHUB_REPOSITORY.git"
          git fetch --depth=1 origin "refs/tags/$env:RELEASE_TAG"
          git checkout --detach FETCH_HEAD

      - name: Install Flutter
        shell: pwsh
        run: |
          $metadata = Invoke-RestMethod "https://storage.googleapis.com/flutter_infra_release/releases/releases_windows.json"
          $release = $metadata.releases | Where-Object {
            $_.version -eq $env:FLUTTER_VERSION -and $_.channel -eq "stable"
          } | Select-Object -First 1
          if ($null -eq $release) {
            throw "Flutter $env:FLUTTER_VERSION stable release was not found."
          }
          $archive = Join-Path $env:RUNNER_TEMP "flutter-windows.zip"
          $url = "https://storage.googleapis.com/flutter_infra_release/releases/$($release.archive)"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actualHash = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $release.sha256) {
            throw "Flutter SDK checksum verification failed."
          }
          $sdkDirectory = Join-Path $env:RUNNER_TEMP "flutter-sdk"
          Expand-Archive -Path $archive -DestinationPath $sdkDirectory
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $sdkDirectory "flutter\bin")

      - name: Build Windows artifact
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          flutter pub get
          flutter build windows --release --build-name $version --build-number $env:GITHUB_RUN_NUMBER

          $releaseDir = Resolve-Path "build/windows/x64/runner/Release"
          $stagingDir = Join-Path $env:RUNNER_TEMP "dayforge-windows-installer"
          $installerDir = Join-Path $stagingDir "installer"
          New-Item -ItemType Directory -Force -Path $installerDir | Out-Null

          $payloadZip = Join-Path $installerDir "payload.zip"
          Compress-Archive -Path (Join-Path $releaseDir.Path "*") `
            -DestinationPath $payloadZip -Force

          $installerProject = @"
<Project Sdk=""Microsoft.NET.Sdk"">
  <PropertyGroup>
    <OutputType>Exe</OutputType>
    <TargetFramework>net8.0-windows</TargetFramework>
    <ImplicitUsings>enable</ImplicitUsings>
    <Nullable>enable</Nullable>
    <AssemblyName>Dayforge-setup</AssemblyName>
    <RuntimeIdentifier>win-x64</RuntimeIdentifier>
    <SelfContained>true</SelfContained>
    <PublishSingleFile>true</PublishSingleFile>
    <EnableCompressionInSingleFile>true</EnableCompressionInSingleFile>
  </PropertyGroup>
</Project>
"@
          Set-Content -Path (Join-Path $installerDir "DayforgeInstaller.csproj") `
            -Value $installerProject -Encoding Ascii

          $installerSource = @"
using Microsoft.Win32;
using System.Diagnostics;
using System.IO.Compression;
using System.Runtime.InteropServices;

internal static class Program
{
    private const string AppName = "Dayforge";
    private const string Publisher = "Reedboot";
    private const string AppExecutable = "dayforge.exe";
    private const string ShortcutName = "Dayforge.lnk";

    public static int Main()
    {
        try
        {
            var installRoot = Path.Combine(
                Environment.GetFolderPath(Environment.SpecialFolder.LocalApplicationData),
                "Programs",
                AppName);
            var programsDir = Path.Combine(
                Environment.GetFolderPath(Environment.SpecialFolder.StartMenu),
                "Programs");
            var shortcutPath = Path.Combine(programsDir, ShortcutName);
            var uninstallScriptPath = Path.Combine(installRoot, "Uninstall-Dayforge.ps1");
            var payloadPath = Path.Combine(AppContext.BaseDirectory, "payload.zip");

            if (!File.Exists(payloadPath))
            {
                throw new FileNotFoundException("Missing payload.zip next to the installer.", payloadPath);
            }

            StopRunningProcesses();
            if (Directory.Exists(installRoot))
            {
                Directory.Delete(installRoot, recursive: true);
            }

            Directory.CreateDirectory(installRoot);
            ZipFile.ExtractToDirectory(payloadPath, installRoot, overwriteFiles: true);
            Directory.CreateDirectory(programsDir);
            CreateShortcut(shortcutPath, Path.Combine(installRoot, AppExecutable), installRoot);
            WriteUninstallScript(uninstallScriptPath, shortcutPath, installRoot);
            RegisterUninstallEntry(installRoot, uninstallScriptPath);

            Console.WriteLine($"Installed {AppName} to {installRoot}");
            return 0;
        }
        catch (Exception ex)
        {
            Console.Error.WriteLine(ex);
            return 1;
        }
    }

    private static void StopRunningProcesses()
    {
        foreach (var process in Process.GetProcessesByName("dayforge"))
        {
            try
            {
                if (!process.CloseMainWindow())
                {
                    process.Kill(entireProcessTree: true);
                    continue;
                }

                if (!process.WaitForExit(5000))
                {
                    process.Kill(entireProcessTree: true);
                    process.WaitForExit(5000);
                }
            }
            catch
            {
                // Ignore best-effort shutdown failures and let the install fail
                // later if files are still locked.
            }
        }
    }

    private static void CreateShortcut(string shortcutPath, string targetPath, string workingDirectory)
    {
        var shellType = Type.GetTypeFromProgID("WScript.Shell")
            ?? throw new InvalidOperationException("WScript.Shell is unavailable.");
        dynamic shell = Activator.CreateInstance(shellType)
            ?? throw new InvalidOperationException("Could not create WScript.Shell.");
        dynamic shortcut = shell.CreateShortcut(shortcutPath);
        shortcut.TargetPath = targetPath;
        shortcut.WorkingDirectory = workingDirectory;
        shortcut.IconLocation = targetPath + ",0";
        shortcut.Description = AppName;
        shortcut.Save();
    }

    private static void WriteUninstallScript(string uninstallScriptPath, string shortcutPath, string installRoot)
    {
        var uninstallKeyPath = @"HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Dayforge";
        var uninstallScript = $$"""
param()
$ErrorActionPreference = 'Stop'
$shortcutPath = '{{shortcutPath}}'
$installRoot = '{{installRoot}}'
$uninstallKeyPath = '{{uninstallKeyPath}}'

if (Test-Path $shortcutPath) {
    Remove-Item $shortcutPath -Force
}

if (Test-Path $uninstallKeyPath) {
    Remove-Item $uninstallKeyPath -Recurse -Force
}

if (Test-Path $installRoot) {
    Remove-Item $installRoot -Recurse -Force
}
""";

        File.WriteAllText(uninstallScriptPath, uninstallScript);
    }

    private static void RegisterUninstallEntry(string installRoot, string uninstallScriptPath)
    {
        const string uninstallKeyPath = @"Software\Microsoft\Windows\CurrentVersion\Uninstall\Dayforge";
        using var key = Registry.CurrentUser.CreateSubKey(uninstallKeyPath, writable: true)
            ?? throw new InvalidOperationException("Could not create uninstall registry key.");

        key.SetValue("DisplayName", AppName);
        key.SetValue("DisplayVersion", "VERSION_PLACEHOLDER");
        key.SetValue("Publisher", Publisher);
        key.SetValue("InstallLocation", installRoot);
        key.SetValue("DisplayIcon", Path.Combine(installRoot, AppExecutable));
        key.SetValue(
            "UninstallString",
            $@"powershell.exe -NoProfile -ExecutionPolicy Bypass -File ""{uninstallScriptPath}""");
        key.SetValue("NoModify", 1, RegistryValueKind.DWord);
        key.SetValue("NoRepair", 1, RegistryValueKind.DWord);
    }
}
"@
          $installerSource = $installerSource.Replace("VERSION_PLACEHOLDER", $version)
          Set-Content -Path (Join-Path $installerDir "Program.cs") -Value $installerSource -Encoding Ascii

          $installerOutput = Join-Path $stagingDir "publish"
          dotnet publish (Join-Path $installerDir "DayforgeInstaller.csproj") `
            -c Release -r win-x64 -o $installerOutput
          Copy-Item (Join-Path $installerOutput "Dayforge-setup.exe") `
            (Join-Path $env:RUNNER_TEMP "Dayforge-windows-x64-setup.exe") -Force

      - name: Upload Windows asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release upload $env:RELEASE_TAG "Dayforge-windows-x64-setup.exe" --clobber
