template: |
  ## Preview build notice

  The Android APK is signed with a temporary CI debug key. Later preview APKs
  may require uninstalling the previous build. Configure a stable private
  signing key before distributing updateable builds.

  The Windows download is a portable zip with `Install-Dayforge.cmd`. Run the
  script after extracting the archive to install Dayforge under
  `%LOCALAPPDATA%\Programs\Dayforge` and create a Start Menu shortcut.
